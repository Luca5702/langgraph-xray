name: CI · Kernel Probes & Web Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Real LangGraph Kernel Probes & Pytest
        run: |
          uv sync --project tools/kernel-inspector
          uv run --project tools/kernel-inspector python -m langgraph_xray_inspector.cli build-all
          uv run --project tools/kernel-inspector pytest tools/kernel-inspector/tests -v

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Typecheck & Build Web + Edge API
        run: |
          pnpm install
          pnpm --filter @langgraph-xray/edge-api exec tsc --noEmit
          pnpm --filter @langgraph-xray/web build
