[project]
name = "langgraph-xray-inspector"
version = "0.1.0"
description = "Build-time real kernel TraceRecording hook & AST/Jedi static symbol blueprint indexer for LangGraph X-Ray"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.0",
    "jedi>=0.19.2",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_xray_inspector"]
